services:
  mochy-navidrome-module:
    image: ghcr.io/1ofx9/mochy-navidrome-module:latest
    container_name: mochy-navidrome-module
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - LOG_LEVEL=info
      - LOG_FORMAT=text

      # Optional: Public URL if behind a reverse proxy (e.g. Caddy, Nginx)
      # - PUBLIC_URL=https://music-module.example.com

      # Upstream Navidrome server address (single-server mode)
      # Not required if running on the same Docker network as Navidrome (auto-discovered at http://navidrome:4533).
      # - NAVIDROME_URL=https://music.example.com

      # Optional: Unique Module ID and Name (for single-server mode)
      # - MODULE_ID=mochy-navidrome
      # - MODULE_NAME=Navidrome

      # Optional: Multi-Server in a single container (path-based routing)
      # Format: slug:Name:URL,slug2:Name2:URL2
      # Exposes /<slug>/manifest.json for each library (e.g. /music/manifest.json and /dolby/manifest.json)
      # - SERVERS=music:Navidrome:https://music.example.com,dolby:Navidrome (Dolby):https://dolby.example.com


    # Optional: If running on the same Docker network as Navidrome,
    # the module automatically discovers http://navidrome:4533 on startup.
    # networks:
    #   - media

# networks:
#   media:
#     external: true
